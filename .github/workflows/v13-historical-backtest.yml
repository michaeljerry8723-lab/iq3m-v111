name: V13.1.1 Historical Backtest

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Historical data provider"
        required: true
        default: "TWELVE_DATA"
        type: choice
        options:
          - "TWELVE_DATA"
          - "AUTO"
          - "TIINGO"
      months:
        description: "Months of 1-minute FX history to test"
        required: true
        default: "6"
        type: choice
        options:
          - "3"
          - "6"
          - "9"
          - "12"
      end_date:
        description: "Optional end date (YYYY-MM-DD). Leave blank to use yesterday UTC."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: v13-historical-backtest
  cancel-in-progress: false

jobs:
  backtest:
    name: Six-pair V13.1.1 historical test
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      BACKTEST_PROVIDER: ${{ inputs.provider || 'TWELVE_DATA' }}
      BACKTEST_MONTHS: ${{ inputs.months || '6' }}
      BACKTEST_END: ${{ inputs.end_date || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify selected provider secret
        shell: bash
        run: |
          case "$BACKTEST_PROVIDER" in
            TWELVE_DATA)
              if [ -z "$TWELVE_DATA_API_KEY" ]; then
                echo "::error::TWELVE_DATA_API_KEY repository secret is missing."
                exit 1
              fi
              ;;
            TIINGO)
              if [ -z "$TIINGO_API_TOKEN" ]; then
                echo "::error::TIINGO_API_TOKEN repository secret is missing."
                exit 1
              fi
              ;;
            AUTO)
              if [ -z "$TIINGO_API_TOKEN" ] && [ -z "$TWELVE_DATA_API_KEY" ]; then
                echo "::error::AUTO requires TIINGO_API_TOKEN or TWELVE_DATA_API_KEY."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown BACKTEST_PROVIDER: $BACKTEST_PROVIDER"
              exit 1
              ;;
          esac
          echo "Provider: $BACKTEST_PROVIDER"
          echo "Months: $BACKTEST_MONTHS"

      - name: Syntax-check backtest files
        run: |
          node --check backtest/strategy-v13.1.1.js
          node --check backtest/metrics.js
          node --check backtest/fetch-tiingo.js
          node --check backtest/backtest.js
          node --check backtest/research-v13.2.js

      - name: Download genuine 1-minute FX history
        run: npm run backtest:fetch

      - name: Run chronological V13.1.1 backtest
        run: npm run backtest

      - name: Run V13.2 research diagnostics
        run: npm run research:v13.2

      - name: Add headline results to job summary
        if: success()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const r = JSON.parse(fs.readFileSync("backtest/results/results.json","utf8"));
          const pct = x => x == null ? "n/a" : (x*100).toFixed(2) + "%";
          const n = x => x == null ? "n/a" : x;
          const lines = [
            "# V13.1.1 Historical Backtest",
            "",
            `**Reference feed:** ${r.provider}`,
            "",
            "**Important:** Mode A tests the reproducible 1-minute historical core. It does not fabricate 30-second ticks, live tick impulse, exact entry spread, Telegram latency, or Pocket Option settlement prices.",
            "",
            "| Sample | PREPARE | Signals | W | L | D | Win rate (W/L) | Signals/day |",
            "|---|---:|---:|---:|---:|---:|---:|---:|",
            `| Development | ${n(r.development.totalPrepareSetups)} | ${n(r.development.totalTestableSignals)} | ${n(r.development.wins)} | ${n(r.development.losses)} | ${n(r.development.draws)} | ${pct(r.development.winRateExcludingDraws)} | ${r.development.signalsPerDay == null ? "n/a" : r.development.signalsPerDay.toFixed(3)} |`,
            `| Holdout | ${n(r.holdout.totalPrepareSetups)} | ${n(r.holdout.totalTestableSignals)} | ${n(r.holdout.wins)} | ${n(r.holdout.losses)} | ${n(r.holdout.draws)} | ${pct(r.holdout.winRateExcludingDraws)} | ${r.holdout.signalsPerDay == null ? "n/a" : r.holdout.signalsPerDay.toFixed(3)} |`,
            `| Overall | ${n(r.overall.totalPrepareSetups)} | ${n(r.overall.totalTestableSignals)} | ${n(r.overall.wins)} | ${n(r.overall.losses)} | ${n(r.overall.draws)} | ${pct(r.overall.winRateExcludingDraws)} | ${r.overall.signalsPerDay == null ? "n/a" : r.overall.signalsPerDay.toFixed(3)} |`,
            "",
            `Period: ${r.overall.period.start} to ${r.overall.period.endExclusive} (end exclusive).`,
            "",
            "Full CSV/JSON/Markdown results are attached as the workflow artifact."
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          NODE

      - name: Upload backtest report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-1-1-historical-backtest-${{ inputs.provider || 'TWELVE_DATA' }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            backtest/BACKTEST_REPORT.md
            backtest/V13_2_RESEARCH.md
            backtest/results/v13.2-research.json
            backtest/results/results.json
            backtest/results/signals.csv
            backtest/results/prepare-setups.csv
            backtest/results/filter-rejections.csv
            backtest/data/manifest.json
