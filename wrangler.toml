name = "iq3m-predictor"
main = "worker.js"
compatibility_date = "2026-09-24"

[vars]
BOT_COMPACT_MODE = "1"
WS_SYMBOLS = "EUR/USD,GBP/USD,USD/JPY,EUR/JPY,GBP/JPY,AUD/USD,USD/CAD"

[[durable_objects.bindings]]
name = "TICK_HUB"
class_name = "TickHub"

[exports.TickHub]
type = "durable-object"
storage = "sqlite"
