name = "forex-signal"
main = "forex-worker.js"
compatibility_date = "2026-09-27"

[vars]
SCALP_MIN_SCORE = "82"
SWING_MIN_SCORE = "82"
SHADOW_DMI_GAP_MIN = "20.93"
SHADOW_ADX_MAX = "76.23"

[[durable_objects.bindings]]
name = "MARKET_HUB"
class_name = "MarketHub"

[exports.MarketHub]
type = "durable-object"
state = "created"
storage = "sqlite"

[triggers]
crons = []
